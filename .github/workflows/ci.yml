name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Builds everything an image is made from, without making an image: that needs a VM, which
  # GitHub's hosted Macs cannot run. macOS builds the nix-darwin system; Linux the runner package.
  system:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3
      - run: nix flake check -L
      - name: Scripts parse
        run: |
          for f in scripts/build.sh scripts/push-kvm.sh; do sh -n "$f"; done
          for f in scripts/build-kvm.sh scripts/provision.sh scripts/provision-linux.sh scripts/smoke-test.sh scripts/smoke-test-linux.sh; do bash -n "$f"; done
